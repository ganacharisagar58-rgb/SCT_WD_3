<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXUS QUIZ | Futuristic Gaming Arena</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0c1a, #03050b);
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            position: relative;
            z-index: 5;
        }

        .navbar {
            position: sticky;
            top: 20px;
            z-index: 100;
            backdrop-filter: blur(18px);
            background: rgba(5, 10, 25, 0.65);
            border-radius: 60px;
            margin: 20px auto 0;
            width: 95%;
            max-width: 1300px;
            border: 1px solid rgba(0, 198, 255, 0.35);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3), 0 0 15px rgba(0, 198, 255, 0.2);
            transition: all 0.3s;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 36px;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-weight: 800;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #00c6ff, #00f5d4, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 38px;
        }

        .nav-links a {
            text-decoration: none;
            color: #e2e8f0;
            font-weight: 500;
            transition: 0.2s;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #00c6ff, #8b5cf6);
            transition: 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: #00f5d4;
            text-shadow: 0 0 6px #00f5d4;
        }

        .hero {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 40px;
            margin: 60px 0 40px;
        }

        .hero-content {
            flex: 1;
        }

        .hero-badge {
            background: rgba(0, 198, 255, 0.15);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            border-left: 3px solid #00f5d4;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .hero h1 {
            font-size: 4.2rem;
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, #fff, #00c6ff, #b77eff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.2rem;
            color: #a0b3d9;
            margin: 24px 0 32px;
            max-width: 500px;
        }

        .glow-btn {
            background: linear-gradient(95deg, #00c6ff, #8b5cf6);
            border: none;
            padding: 14px 40px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
        }

        .glow-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px #00c6ff;
        }

        .hero-stats {
            display: flex;
            gap: 32px;
            margin-top: 48px;
        }

        .stat-circle {
            text-align: center;
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 700;
            text-align: center;
            margin: 70px 0 40px;
            background: linear-gradient(145deg, #fff, #8b5cf6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-family: 'Orbitron', monospace;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .glass-card {
            background: rgba(15, 25, 45, 0.55);
            backdrop-filter: blur(14px);
            border-radius: 32px;
            padding: 32px 24px;
            text-align: center;
            border: 1px solid rgba(0, 198, 255, 0.3);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .glass-card i {
            font-size: 3rem;
            background: linear-gradient(145deg, #00f5d4, #8b5cf6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }

        .glass-card:hover {
            transform: translateY(-12px);
            border-color: #00f5d4;
            box-shadow: 0 20px 40px rgba(0, 245, 212, 0.2), 0 0 25px rgba(0, 198, 255, 0.4);
        }

        .dashboard-row {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin: 60px 0;
        }

        .quiz-panel {
            flex: 2;
            background: rgba(10, 20, 35, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 32px;
            border: 1px solid rgba(0, 198, 255, 0.3);
        }

        .leaderboard-panel {
            flex: 1;
            background: rgba(8, 18, 32, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 28px;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 20px 0;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 30px 0;
        }

        .option-btn {
            background: rgba(30, 40, 65, 0.8);
            border: 1px solid rgba(0, 198, 255, 0.3);
            border-radius: 60px;
            padding: 14px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(0, 198, 255, 0.2);
            border-color: #00c6ff;
            transform: translateX(8px);
        }

        .option-btn.selected {
            background: linear-gradient(95deg, #00c6ff30, #8b5cf630);
            border-left: 6px solid #00f5d4;
            box-shadow: 0 0 12px #00c6ff;
        }

        .timer-progress {
            background: #1e2a3a;
            border-radius: 20px;
            height: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .timer-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00f5d4, #00c6ff);
            transition: width 0.1s linear;
        }

        .score-area {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: right;
            color: #00f5d4;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 198, 255, 0.2);
        }

        .stats-mini {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }

        .footer {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 40px 40px 0 0;
            padding: 50px 30px 30px;
            margin-top: 80px;
        }

        .floating-shape {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0,245,212,0.1), transparent);
            border-radius: 50%;
            filter: blur(50px);
            pointer-events: none;
            z-index: 0;
        }

        @media (max-width: 880px) {
            .hero h1 {
                font-size: 2.4rem;
            }

            .nav-links {
                display: none;
            }

            .container {
                padding: 0 20px;
            }

            .question-text {
                font-size: 1.3rem;
            }
        }

        .next-btn {
            background: #00c6ff;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

</html>
